<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EL WAMY — Admin</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="admin-manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="images/elwamy-logo.jpg">
  <link rel="icon" type="image/jpeg" href="images/elwamy-logo.jpg">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          boxShadow: {
            'card': '0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { max-width: 100%; min-height: 100dvh; }
    .touch-manipulation { touch-action: manipulation; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim { animation: shake 0.4s ease-in-out; }
  </style>

  <!-- Supabase JS Client v2 & Configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>

  <!-- Early Auth Guard: Verify session with Supabase server -->
  <script src="js/admin-auth.js"></script>
  <script>
    if (window.AdminAuth && window.AdminAuth.isAuthenticated()) {
      window.AdminAuth.verifyServerSession().then(res => {
        if (res.authenticated) {
          window.location.replace('admin.html');
        }
      });
    }
  </script>
</head>
<body class="min-h-full font-sans text-slate-800 antialiased flex flex-col justify-center items-center p-4 sm:p-6 bg-[#F8FAFC]">

  <!-- Background decorative glows -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-blue-500/10 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-indigo-500/10 blur-3xl"></div>
  </div>

  <main class="relative z-10 w-full max-w-md">

    <!-- Card Container -->
    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-card border border-slate-200/80">
      
      <!-- Logo & Header -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl overflow-hidden shadow-lg shadow-blue-500/20 mb-3 hover:scale-105 transition-transform">
          <img src="images/elwamy-logo.jpg" alt="EL WAMY" class="w-full h-full object-cover">
        </div>
        <h1 class="font-display font-extrabold text-2xl text-slate-900 tracking-tight">
          EL <span class="text-blue-600">WAMY</span>
        </h1>
        <p class="text-xs text-slate-500 mt-1 font-medium">Admin Dashboard</p>
      </div>

      <!-- Sign In -->
      <div class="mb-5">
        <div class="w-full py-2 text-center text-xs font-bold rounded-xl bg-white text-blue-600">
          Sign In
        </div>
      </div>

      <!-- Alert Messages -->
      <div id="login-error-alert" class="hidden mb-4 p-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
        <svg class="w-4 h-4 text-rose-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span id="login-error-text">Invalid credentials.</span>
      </div>

      <div id="login-success-alert" class="hidden mb-4 p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold flex items-center gap-2">
        <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="login-success-text">Success.</span>
      </div>

      <!-- Auth Form -->
      <form id="admin-login-form" class="space-y-4" autocomplete="on">

        <!-- Email Field -->
        <div>
          <label for="admin-email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Admin Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
            </div>
            <input 
              type="email" 
              id="admin-email" 
              name="email"
              required 
              autofocus
              placeholder="admin@example.com" 
              class="w-full pl-10 pr-4 py-3 bg-slate-50 focus:bg-white border border-slate-200 focus:border-blue-500 rounded-2xl text-sm font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="admin-password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input 
              type="password" 
              id="admin-password" 
              name="password"
              required 
              placeholder="••••••••••••••••" 
              class="w-full pl-10 pr-11 py-3 bg-slate-50 focus:bg-white border border-slate-200 focus:border-blue-500 rounded-2xl text-sm font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all font-mono"
            >
            <button 
              type="button" 
              id="btn-toggle-password" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-700 focus:outline-none touch-manipulation" 
              title="Show or hide password"
            >
              <svg id="icon-eye-show" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg id="icon-eye-hide" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div id="row-remember" class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input 
              type="checkbox" 
              id="remember-me" 
              checked 
              class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
            >
            <span class="text-xs font-semibold text-slate-600">Remember on this device</span>
          </label>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="btn-submit-login" 
            class="w-full py-3.5 px-4 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold text-sm shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-2 touch-manipulation"
          >
            <span id="btn-submit-text">Sign In to Dashboard</span>
            <svg id="btn-submit-spinner" class="w-4 h-4 animate-spin hidden text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </div>

      </form>

      <!-- Bottom Links -->
      <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 font-medium">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-blue-600 hover:text-blue-700 font-semibold hover:underline">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          <span>Back to Store</span>
        </a>
      </div>

    </div>

  </main>

  <script>
    (function() {
      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('admin-email');
      const passInput = document.getElementById('admin-password');
      const rowRemember = document.getElementById('row-remember');
      const rememberCheckbox = document.getElementById('remember-me');
      const togglePassBtn = document.getElementById('btn-toggle-password');
      const eyeShow = document.getElementById('icon-eye-show');
      const eyeHide = document.getElementById('icon-eye-hide');
      const submitBtn = document.getElementById('btn-submit-login');
      const submitText = document.getElementById('btn-submit-text');
      const submitSpinner = document.getElementById('btn-submit-spinner');
      const errorAlert = document.getElementById('login-error-alert');
      const errorText = document.getElementById('login-error-text');
      const successAlert = document.getElementById('login-success-alert');
      const successText = document.getElementById('login-success-text');

      // 1. Password Visibility Toggle
      let isPassVisible = false;
      togglePassBtn.addEventListener('click', () => {
        isPassVisible = !isPassVisible;
        passInput.type = isPassVisible ? 'text' : 'password';
        if (isPassVisible) {
          eyeShow.classList.add('hidden');
          eyeHide.classList.remove('hidden');
        } else {
          eyeShow.classList.remove('hidden');
          eyeHide.classList.add('hidden');
        }
      });

      // 2. Form Submission — sign in only. Admin accounts are created and
      // promoted exclusively from the Supabase SQL Editor by the site owner
      // (SELECT public.promote_user_to_admin('email');) — there is
      // intentionally no self-serve "Register Admin" option on this page.
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlerts();

        const email = emailInput.value.trim();
        const password = passInput.value;
        const remember = rememberCheckbox.checked;

        if (!email || !password) {
          showError('Please provide both email and password.');
          return;
        }

        setLoading(true);

        try {
          const res = await window.AdminAuth.login(email, password, remember);
          if (res.success) {
            submitText.textContent = 'Verified! Redirecting...';
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') ? decodeURIComponent(params.get('redirect')) : 'admin.html';
            setTimeout(() => {
              window.location.replace(redirect);
            }, 300);
          } else {
            setLoading(false);
            showError(res.message || 'Invalid email or password.');
          }
        } catch (err) {
          setLoading(false);
          showError('An unexpected authentication error occurred.');
        }
      });

      function showError(msg) {
        errorText.textContent = msg;
        errorAlert.classList.remove('hidden');
        successAlert.classList.add('hidden');
        form.classList.remove('shake-anim');
        void form.offsetWidth;
        form.classList.add('shake-anim');
      }

      function showSuccess(msg) {
        successText.textContent = msg;
        successAlert.classList.remove('hidden');
        errorAlert.classList.add('hidden');
      }

      function hideAlerts() {
        errorAlert.classList.add('hidden');
        successAlert.classList.add('hidden');
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
          submitText.textContent = 'Verifying...';
          submitSpinner.classList.remove('hidden');
        } else {
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
          submitText.textContent = 'Sign In to Dashboard';
          submitSpinner.classList.add('hidden');
        }
      }
    })();
  </script>
</body>
</html>
